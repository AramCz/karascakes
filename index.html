<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f5f0">

    <title>Magazines | Kara's Cakes</title>

    <meta name="description"
          content="Explore Kara's Cakes digital magazines and read or download our issues.">

    <style>
        :root {
            --background: #f8f5f0;
            --card-background: #fffdf9;
            --text: #51463f;
            --muted: #776960;
            --accent: #9b8374;
            --line: #e8ded4;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 8%;
            border-bottom: 1px solid #e8ded4;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .logo img {
            display: block;
            width: auto;
            height: 65px;
            max-width: 220px;
            object-fit: contain;
            object-position: center;
        }

        .tagline {
            width: 100%;
            margin-top: 8px;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #9b8374;
            text-align: center;
        }

        /* NAVIGATION & HEADER CART */

        .header-right {
            display: flex;
            align-items: center;
            gap: 38px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 38px;
        }

        nav a {
            position: relative;
            text-decoration: none;
            color: #51463f;
            font-size: 12px;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            padding: 8px 0;
            transition: color 0.3s;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 1px;
            background: #9b8374;
            transition: width 0.3s;
        }

        nav a:hover {
            color: #9b8374;
        }

        nav a:hover::after {
            width: 100%;
        }

        .cart-link {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border: 1px solid var(--line);
            background: var(--card-background);
            color: #51463f;
            text-decoration: none;
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 1px;
            transition: border-color 0.25s ease, color 0.25s ease, background-color 0.25s ease;
        }

        .cart-link:hover {
            border-color: var(--accent);
            color: #9b8374;
        }

        .cart-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .cart-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 999px;
            background: var(--accent);
            color: #fffdf9;
            font-family: 'Lato', sans-serif;
            font-size: 11px;
            font-weight: 600;
            line-height: 1;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .cart-count.is-empty {
            background: #c5b6ab;
        }

        /* MAIN */

        main {
            flex: 1 0 auto;
        }

        .magazines-page {
            max-width: 1040px;
            margin: 0 auto;
            padding: 75px 7% 100px;
        }

        .magazines-header {
            text-align: center;
            margin-bottom: 55px;
        }

        .section-label {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #9b8374;
            margin-bottom: 18px;
        }

        .magazines-header h1 {
            font-size: clamp(32px, 4.2vw, 46px);
            font-weight: normal;
            margin-bottom: 18px;
        }

        .magazines-header p {
            font-size: 16px;
            line-height: 1.9;
            color: var(--muted);
            max-width: 560px;
            margin: 0 auto;
        }

        .magazine-issue-card {
            max-width: 440px;
            margin: 0 auto;
            background: var(--card-background);
            border: 1px solid var(--line);
            padding: 28px;
            text-align: center;
        }

        .magazine-issue-cover {
            display: block;
            margin-bottom: 24px;
            text-decoration: none;
        }

        .magazine-issue-cover img {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;
        }

        .magazine-issue-card h2 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 12px;
        }

        .magazine-issue-card p {
            font-size: 14px;
            line-height: 1.8;
            color: var(--muted);
            margin-bottom: 26px;
        }

        .button {
            display: inline-block;
            padding: 15px 34px;
            border: 1px solid #8d7565;
            color: #51463f;
            text-decoration: none;
            letter-spacing: 2px;
            font-size: 11px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .button:hover {
            background: #51463f;
            color: #fff;
            border-color: #51463f;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid #e8ded4;
            color: #9b8374;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        /* TABLET & MOBILE */

        @media (max-width: 900px) {
            .header-right,
            nav {
                gap: 24px;
            }
        }

        @media (max-width: 650px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 25px 15px;
            }

            .header-right {
                flex-wrap: wrap;
                justify-content: center;
                gap: 16px 23px;
            }

            .brand {
                align-items: center;
                text-align: center;
            }

            .logo img {
                height: 58px;
                max-width: 200px;
                margin: 0 auto;
                object-position: center;
            }

            nav {
                gap: 23px;
            }

            nav a {
                font-size: 10px;
                letter-spacing: 1px;
            }

            .cart-link {
                padding: 6px 10px;
                font-size: 10px;
            }

            .cart-icon {
                width: 16px;
                height: 16px;
            }

            .cart-count {
                min-width: 18px;
                height: 18px;
                font-size: 10px;
            }

            .magazines-page {
                padding: 55px 20px 75px;
            }

            .magazine-issue-card {
                padding: 20px;
            }
        }

        @media (max-width: 380px) {
            .header-right,
            nav {
                gap: 14px;
            }

            nav a {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="brand">
            <a href="../index.html" class="logo">
                <img src="../images/Logo.png" alt="Kara's Cakes Logo">
            </a>
            <div class="tagline">Made with Love</div>
        </div>

        <div class="header-right">
            <nav>
                <a href="../index.html">Home</a>
                <a href="../cakes/index.html">Our Cakes</a>
                <a href="../index.html#contact">Contact</a>
            </nav>

            <a href="../cart/index.html" class="cart-link" aria-label="Shopping Cart">
                <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="9" cy="20" r="1.5"></circle>
                    <circle cx="18" cy="20" r="1.5"></circle>
                    <path d="M2.5 3h2l2.4 11.5a1.5 1.5 0 0 0 1.5 1.2h9.8a1.5 1.5 0 0 0 1.45-1.15L21 7H6.2"></path>
                </svg>
                <span class="cart-count is-empty" data-cart-count>0</span>
            </a>
        </div>
    </header>

    <main>
        <section class="magazines-page">
            <div class="magazines-header">
                <div class="section-label">Editorial Editions</div>
                <h1>Magazines</h1>
                <p>
                    Open our digital flipbook issue to browse pages and download a copy.
                </p>
            </div>

            <article class="magazine-issue-card">
                <a href="https://heyzine.com/flip-book/388b6c738f.html"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="magazine-issue-cover">
                    <img src="../images/Magazine_N1_3D.png"
                         alt="Kara's Cakes Magazine Issue No. 1">
                </a>

                <h2>Issue No. 1</h2>
                <p>
                    Handmade cakes, sweet notes, and seasonal favorites from Kara's Cakes.
                </p>

                <a href="https://heyzine.com/flip-book/388b6c738f.html"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="button">
                    Open Issue No. 1
                </a>
            </article>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        © 2026 Kara's Cakes. All Rights Reserved.
    </footer>

    <script>
        (function () {
            const CART_STORAGE_KEY = 'karasCakesCart';

            function readCart() {
                try {
                    const raw = localStorage.getItem(CART_STORAGE_KEY);
                    const parsed = raw ? JSON.parse(raw) : [];
                    return Array.isArray(parsed) ? parsed : [];
                } catch (err) {
                    return [];
                }
            }

            function getTotalQuantity(items) {
                return items.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
            }

            function renderCartBadge() {
                const total = getTotalQuantity(readCart());
                document.querySelectorAll('[data-cart-count]').forEach((badge) => {
                    badge.textContent = String(total);
                    badge.classList.toggle('is-empty', total === 0);
                });
            }

            window.KarasCart = {
                key: CART_STORAGE_KEY,
                getItems: readCart,
                getCount: () => getTotalQuantity(readCart()),
                addItem(cakeItem) {
                    const items = readCart();
                    const qtyToAdd = Math.max(1, Number(cakeItem.quantity) || 1);
                    const existing = items.find((item) => item.id === cakeItem.id);

                    if (existing) {
                        existing.quantity = (Number(existing.quantity) || 0) + qtyToAdd;
                    } else {
                        items.push({
                            id: cakeItem.id,
                            name: cakeItem.name,
                            image: cakeItem.image || '',
                            quantity: qtyToAdd
                        });
                    }

                    localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(items));
                    renderCartBadge();
                    window.dispatchEvent(new CustomEvent('cart:updated', { detail: items }));
                    return items;
                },
                refresh: renderCartBadge
            };

            renderCartBadge();
            window.addEventListener('storage', renderCartBadge);
            window.addEventListener('cart:updated', renderCartBadge);
        })();
    </script>

</body>
</html>
