<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f5f0">

    <title>Your Cart | Kara's Cakes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Lato:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --background: #f8f5f0;
            --card-background: #fffdf9;
            --text: #51463f;
            --muted: #776960;
            --accent: #9b8374;
            --line: #e8ded4;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: 'Lato', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* HEADER */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 8%;
            border-bottom: 1px solid #e8ded4;
            font-family: Georgia, serif;
            font-weight: normal;
            color: #51463f;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .logo img {
            display: block;
            width: auto;
            height: 65px;
            max-width: 220px;
            object-fit: contain;
            object-position: center;
        }

        .tagline {
            width: 100%;
            margin-top: 8px;
            font-family: Georgia, serif;
            font-weight: normal;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #9b8374;
            text-align: center;
        }

        /* NAVIGATION & HEADER CART */

        .header-right {
            display: flex;
            align-items: center;
            gap: 38px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 38px;
        }

        nav a {
            position: relative;
            text-decoration: none;
            font-family: Georgia, serif;
            font-weight: normal;
            color: #51463f;
            font-size: 12px;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            padding: 8px 0;
            transition: color 0.3s;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 1px;
            background: #9b8374;
            transition: width 0.3s;
        }

        nav a:hover {
            color: #9b8374;
        }

        nav a:hover::after {
            width: 100%;
        }

        .cart-link {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border: 1px solid var(--accent);
            background: var(--card-background);
            color: #51463f;
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 1px;
            transition: border-color 0.25s ease, color 0.25s ease, background-color 0.25s ease;
        }

        .cart-link:hover {
            border-color: var(--text);
            color: #9b8374;
        }

        .cart-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .cart-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 999px;
            background: var(--accent);
            color: #fffdf9;
            font-family: 'Lato', sans-serif;
            font-size: 11px;
            font-weight: 600;
            line-height: 1;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .cart-count.is-empty {
            background: #c5b6ab;
        }

        /* MAIN CART CONTENT */

        main {
            flex: 1 0 auto;
        }

        .cart-page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 60px 7% 100px;
        }

        .cart-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .eyebrow {
            font-family: Georgia, serif;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .cart-header h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(34px, 4.5vw, 50px);
            font-weight: 400;
            line-height: 1.2;
            color: var(--text);
            margin-bottom: 14px;
        }

        .cart-header p {
            font-family: Georgia, serif;
            font-size: 15px;
            line-height: 1.8;
            color: var(--muted);
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1.55fr 0.85fr;
            gap: 40px;
            align-items: start;
        }

        .cart-items-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 92px 1fr auto;
            gap: 22px;
            align-items: center;
            background: var(--card-background);
            border: 1px solid var(--line);
            padding: 18px 22px;
        }

        .cart-item-image {
            width: 92px;
            height: 104px;
            background: #eee8df;
            overflow: hidden;
            flex-shrink: 0;
        }

        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cart-item-info h2 {
            font-family: Georgia, serif;
            font-size: 20px;
            font-weight: normal;
            color: var(--text);
            margin-bottom: 6px;
        }

        .cart-item-meta {
            font-family: Georgia, serif;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .cart-item-subtotal {
            font-family: Georgia, serif;
            font-size: 15px;
            color: var(--text);
        }

        .cart-item-controls {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .quantity-stepper {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--line);
            background: var(--background);
        }

        .qty-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            color: var(--text);
            font-family: 'Lato', sans-serif;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .qty-btn:hover {
            background: var(--line);
        }

        .qty-value {
            min-width: 36px;
            text-align: center;
            font-family: 'Lato', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .remove-btn {
            border: none;
            background: none;
            color: var(--muted);
            font-family: Georgia, serif;
            font-size: 11px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            cursor: pointer;
            padding: 2px 0;
            border-bottom: 1px solid transparent;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .remove-btn:hover {
            color: var(--text);
            border-bottom-color: var(--text);
        }

        /* SUMMARY CARD */

        .cart-summary {
            background: var(--card-background);
            border: 1px solid var(--line);
            padding: 30px 28px;
        }

        .cart-summary h2 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 28px;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 20px;
        }

        .summary-divider {
            width: 48px;
            height: 1px;
            background: var(--accent);
            margin-bottom: 22px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
            font-family: Georgia, serif;
            font-size: 14px;
            color: var(--muted);
        }

        .summary-row strong {
            font-weight: normal;
            color: var(--text);
            font-size: 16px;
        }

        .summary-row.total-row {
            padding-top: 16px;
            padding-bottom: 14px;
            border-bottom: none;
            color: var(--text);
            font-size: 16px;
        }

        .summary-row.total-row strong {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 24px;
            font-weight: 400;
            color: var(--text);
        }

        .summary-note {
            margin-top: 12px;
            font-family: Georgia, serif;
            font-size: 13px;
            line-height: 1.75;
            color: var(--muted);
        }

        .primary-btn {
            display: block;
            width: 100%;
            margin-top: 26px;
            padding: 16px 24px;
            background: var(--text);
            border: 1px solid var(--text);
            color: #ffffff;
            font-family: Georgia, serif;
            font-size: 11px;
            letter-spacing: 2.2px;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .primary-btn:hover {
            background: transparent;
            color: var(--text);
        }

        .secondary-link {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 14px 20px;
            border: 1px solid var(--line);
            color: var(--text);
            font-family: Georgia, serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            transition: border-color 0.25s ease, color 0.25s ease;
        }

        .secondary-link:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .checkout-status {
            margin-top: 14px;
            font-family: Georgia, serif;
            font-size: 13px;
            line-height: 1.6;
            color: var(--accent);
            min-height: 20px;
        }

        /* EMPTY STATE */

        .empty-cart {
            text-align: center;
            background: var(--card-background);
            border: 1px solid var(--line);
            padding: 64px 24px;
            max-width: 620px;
            margin: 0 auto;
        }

        .empty-cart h2 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 30px;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 14px;
        }

        .empty-cart p {
            font-family: Georgia, serif;
            font-size: 15px;
            line-height: 1.85;
            color: var(--muted);
            margin-bottom: 28px;
        }

        .empty-cart .primary-btn {
            display: inline-block;
            width: auto;
            margin-top: 0;
            padding: 15px 36px;
        }

        /* FOOTER */

        footer {
            font-family: Georgia, serif;
            font-weight: normal;
            text-align: center;
            padding: 28px 15px;
            color: #776960;
            font-size: 11px;
            letter-spacing: 1px;
            border-top: 1px solid var(--line);
        }

        /* TABLET & MOBILE */

        @media (max-width: 900px) {
            .header-right,
            nav {
                gap: 24px;
            }

            .cart-layout {
                grid-template-columns: 1fr;
                gap: 28px;
            }
        }

        @media (max-width: 650px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 25px 15px;
            }

            .header-right {
                flex-wrap: wrap;
                justify-content: center;
                gap: 16px 23px;
            }

            .brand {
                align-items: center;
                text-align: center;
            }

            .logo img {
                height: 58px;
                max-width: 200px;
                margin: 0 auto;
            }

            nav {
                gap: 23px;
            }

            nav a {
                font-size: 10px;
                letter-spacing: 1px;
            }

            .cart-link {
                padding: 6px 10px;
                font-size: 10px;
            }

            .cart-icon {
                width: 16px;
                height: 16px;
            }

            .cart-count {
                min-width: 18px;
                height: 18px;
                font-size: 10px;
            }

            .cart-page {
                padding: 40px 6% 75px;
            }

            .cart-item {
                grid-template-columns: 74px 1fr;
                gap: 14px 16px;
                padding: 16px;
            }

            .cart-item-image {
                width: 74px;
                height: 84px;
            }

            .cart-item-controls {
                grid-column: 1 / -1;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding-top: 10px;
                border-top: 1px solid var(--line);
            }
        }

        @media (max-width: 380px) {
            .header-right,
            nav {
                gap: 14px;
            }

            nav a {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="brand">
            <a href="../index.html" class="logo">
                <img src="../images/Logo.png" alt="Kara's Cakes Logo">
            </a>
            <div class="tagline">Made with Love</div>
        </div>

        <div class="header-right">
            <nav>
                <a href="../index.html">Home</a>
                <a href="../cakes/index.html">Our Cakes</a>
                <a href="../index.html#contact">Contact</a>
            </nav>

            <a href="index.html" class="cart-link" aria-label="Shopping Cart">
                <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="9" cy="20" r="1.5"></circle>
                    <circle cx="18" cy="20" r="1.5"></circle>
                    <path d="M2.5 3h2l2.4 11.5a1.5 1.5 0 0 0 1.5 1.2h9.8a1.5 1.5 0 0 0 1.45-1.15L21 7H6.2"></path>
                </svg>
                <span class="cart-count is-empty" data-cart-count>0</span>
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <section class="cart-page">
            <div class="cart-header">
                <div class="eyebrow">Your Selection</div>
                <h1>Shopping Cart</h1>
                <p>Review your chosen cakes, adjust quantities, or proceed to place your order.</p>
            </div>

            <div id="cart-content"></div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        © 2026 Kara's Cakes. All Rights Reserved.
    </footer>

    <script src="../js/cake-prices.js"></script>
    <script>
        (function () {
            const CART_STORAGE_KEY = 'karasCakesCart';
            const MAX_CAKE_QUANTITY = 100;

            const FALLBACK_CAKE_IMAGES = {
                "berry-cake": "../images/BerryCake.jpg",
                "chocolate-cake": "../images/ChocolateCake.jpg",
                "zebra": "../images/Zebra_1.jpg",
                "sochi-walnut-pastry": "../images/Sochinskiy.jpg",
                "gata": "../images/Gata.jpg",
                "cigarettes": "../images/Cigarettes.jpg",
                "birds-milk-pastry": "../images/BirdsMilk.jpg",
                "bon-bon": "../images/BonBon.png",
                "berry-basket": "../images/BerryBasket.jpg"
            };

            function formatPrice(value) {
                const numeric = Number(value) || 0;
                const rounded = Math.round(numeric * 100) / 100;
                return Number.isInteger(rounded) ? `$${rounded}` : `$${rounded.toFixed(2)}`;
            }

            function getEffectiveUnitPrice(item) {
                if (typeof window.getCakePrice === 'function') {
                    return window.getCakePrice(item.id, item.price);
                }
                const parsed = Number(item.price);
                return Number.isNaN(parsed) ? 0 : Math.max(0, parsed);
            }

            function getEffectiveName(item) {
                if (typeof window.getCakeCatalogEntry === 'function') {
                    const entry = window.getCakeCatalogEntry(item.id);
                    if (entry && entry.name) return entry.name;
                }
                return String(item.name || item.id);
            }

            function resolveImagePath(rawSrc, id) {
                if (rawSrc && typeof rawSrc === 'string') {
                    if (rawSrc.startsWith('../../')) {
                        return '../' + rawSrc.slice(6);
                    }
                    if (rawSrc.startsWith('../')) {
                        return rawSrc;
                    }
                    return rawSrc;
                }
                return FALLBACK_CAKE_IMAGES[id] || '../images/BonBon.png';
            }

            function readCart() {
                try {
                    const raw = localStorage.getItem(CART_STORAGE_KEY);
                    const parsed = raw ? JSON.parse(raw) : [];
                    return Array.isArray(parsed)
                        ? parsed.filter(item => item && item.id && (Number(item.quantity) || 0) > 0)
                        : [];
                } catch (err) {
                    return [];
                }
            }

            function writeCart(items) {
                const sanitized = items
                    .filter(item => item && item.id && (Number(item.quantity) || 0) > 0)
                    .map(item => ({
                        id: String(item.id),
                        name: getEffectiveName(item),
                        price: getEffectiveUnitPrice(item),
                        image: item.image || '',
                        quantity: Math.min(MAX_CAKE_QUANTITY, Math.max(1, Math.floor(Number(item.quantity) || 1)))
                    }));

                localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(sanitized));
                renderCartBadge(sanitized);
                renderCartPage(sanitized);
                window.dispatchEvent(new CustomEvent('cart:updated', { detail: sanitized }));
                return sanitized;
            }

            function getTotalQuantity(items) {
                return items.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
            }

            function getTotalPrice(items) {
                return items.reduce((sum, item) => {
                    const qty = Number(item.quantity) || 0;
                    const unitPrice = getEffectiveUnitPrice(item);
                    return sum + (unitPrice * qty);
                }, 0);
            }

            function renderCartBadge(items = readCart()) {
                const total = getTotalQuantity(items);
                document.querySelectorAll('[data-cart-count]').forEach((badge) => {
                    badge.textContent = String(total);
                    badge.classList.toggle('is-empty', total === 0);
                });
            }

            function changeQuantity(id, delta) {
                const items = readCart();
                const target = items.find(item => item.id === id);
                if (!target) return;

                const nextQty = (Number(target.quantity) || 0) + delta;
                if (nextQty <= 0) {
                    writeCart(items.filter(item => item.id !== id));
                } else {
                    target.quantity = Math.min(MAX_CAKE_QUANTITY, nextQty);
                    writeCart(items);
                }
            }

            function removeItem(id) {
                const items = readCart().filter(item => item.id !== id);
                writeCart(items);
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = String(text);
                return div.innerHTML;
            }

            function renderCartPage(items = readCart()) {
                const container = document.getElementById('cart-content');
                if (!container) return;

                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="empty-cart">
                            <h2>Your Cart is Empty</h2>
                            <p>You haven't selected any cakes yet. Explore our handcrafted collection to add your favorites.</p>
                            <a href="../cakes/index.html" class="primary-btn">Browse Our Cakes</a>
                        </div>
                    `;
                    return;
                }

                const totalCakes = getTotalQuantity(items);
                const cakeTypesCount = items.length;
                const totalPrice = getTotalPrice(items);

                const itemsHtml = items.map(item => {
                    const imgSrc = resolveImagePath(item.image, item.id);
                    const qty = Number(item.quantity) || 1;
                    const unitPrice = getEffectiveUnitPrice(item);
                    const lineTotal = unitPrice * qty;
                    const displayName = getEffectiveName(item);
                    const safeName = escapeHtml(displayName);
                    const safeId = escapeHtml(item.id);
                    const detailHref = `../cakes/cake-details/?cake=${encodeURIComponent(item.id)}`;

                    return `
                        <article class="cart-item" data-cake-id="${safeId}">
                            <a href="${detailHref}" class="cart-item-image">
                                <img src="${escapeHtml(imgSrc)}" alt="${safeName}">
                            </a>

                            <div class="cart-item-info">
                                <h2><a href="${detailHref}">${safeName}</a></h2>
                                <div class="cart-item-meta">${formatPrice(unitPrice)} each &bull; Qty: ${qty}</div>
                                <div class="cart-item-subtotal">Subtotal: ${formatPrice(lineTotal)}</div>
                            </div>

                            <div class="cart-item-controls">
                                <div class="quantity-stepper" aria-label="Quantity for ${safeName}">
                                    <button type="button" class="qty-btn" data-action="decrease" data-id="${safeId}" aria-label="Decrease quantity of ${safeName}">&minus;</button>
                                    <span class="qty-value">${qty}</span>
                                    <button type="button" class="qty-btn" data-action="increase" data-id="${safeId}" aria-label="Increase quantity of ${safeName}">+</button>
                                </div>

                                <button type="button" class="remove-btn" data-action="remove" data-id="${safeId}">Remove</button>
                            </div>
                        </article>
                    `;
                }).join('');

                container.innerHTML = `
                    <div class="cart-layout">
                        <div class="cart-items-list">
                            ${itemsHtml}
                        </div>

                        <aside class="cart-summary" aria-label="Order Summary">
                            <h2>Order Summary</h2>
                            <div class="summary-divider"></div>

                            <div class="summary-row">
                                <span>Cake Varieties</span>
                                <strong>${cakeTypesCount}</strong>
                            </div>

                            <div class="summary-row">
                                <span>Total Cakes</span>
                                <strong>${totalCakes}</strong>
                            </div>

                            <div class="summary-row total-row">
                                <span>Total</span>
                                <strong>${formatPrice(totalPrice)}</strong>
                            </div>

                            <p class="summary-note">
                                Each cake is freshly prepared to order in Los Angeles. You can adjust quantities or continue to order details.
                            </p>

                            <button type="button" id="proceed-to-order-btn" class="primary-btn">Proceed to Order</button>
                            <a href="../cakes/index.html" class="secondary-link">Continue Browsing</a>
                            <div class="checkout-status" id="checkout-status" role="status" aria-live="polite"></div>
                        </aside>
                    </div>
                `;
            }

            document.addEventListener('click', (event) => {
                const actionEl = event.target.closest('[data-action]');
                if (actionEl) {
                    const action = actionEl.getAttribute('data-action');
                    const id = actionEl.getAttribute('data-id');
                    if (!id) return;

                    if (action === 'increase') {
                        changeQuantity(id, 1);
                    } else if (action === 'decrease') {
                        changeQuantity(id, -1);
                    } else if (action === 'remove') {
                        removeItem(id);
                    }
                    return;
                }

                if (event.target && event.target.id === 'proceed-to-order-btn') {
                    const statusEl = document.getElementById('checkout-status');
                    const items = readCart();
                    if (statusEl && items.length > 0) {
                        statusEl.textContent = `Ready to order ${getTotalQuantity(items)} cake(s) for ${formatPrice(getTotalPrice(items))}. Order step coming next!`;
                    }
                }
            });

            window.KarasCart = {
                key: CART_STORAGE_KEY,
                getItems: readCart,
                getCount: () => getTotalQuantity(readCart()),
                getTotal: () => getTotalPrice(readCart()),
                addItem(cakeItem) {
                    const items = readCart();
                    const qtyToAdd = Math.min(MAX_CAKE_QUANTITY, Math.max(1, Number(cakeItem.quantity) || 1));
                    const existing = items.find((item) => item.id === cakeItem.id);
                    const itemPrice = getEffectiveUnitPrice(cakeItem);
                    const itemName = getEffectiveName(cakeItem);

                    if (existing) {
                        existing.quantity = Math.min(MAX_CAKE_QUANTITY, (Number(existing.quantity) || 0) + qtyToAdd);
                        existing.price = itemPrice;
                        existing.name = itemName;
                    } else {
                        items.push({
                            id: cakeItem.id,
                            name: itemName,
                            price: itemPrice,
                            image: cakeItem.image || '',
                            quantity: qtyToAdd
                        });
                    }

                    return writeCart(items);
                },
                refresh: () => {
                    renderCartBadge();
                    renderCartPage();
                }
            };

            renderCartBadge();
            renderCartPage();

            if (typeof window.reloadCakeCatalog === 'function') {
                window.reloadCakeCatalog('../js/cake-prices.js', () => {
                    renderCartBadge();
                    renderCartPage();
                });
            }

            window.addEventListener('storage', () => {
                renderCartBadge();
                renderCartPage();
            });
            window.addEventListener('cart:updated', (e) => {
                const nextItems = Array.isArray(e.detail) ? e.detail : readCart();
                renderCartBadge(nextItems);
                renderCartPage(nextItems);
            });
        })();
    </script>

</body>
</html>
